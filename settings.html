<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Lite</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="icons/256.png">
    <link rel="manifest" href="./manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slate Lite">

    <link rel="apple-touch-icon" href="icons/180.png">
</head>
<body>
    <div class="main-section" >
<div class="settings" id="settingsDialog">
    <div class="column-section" style="width: 100%; justify-content: space-between; align-items: center; margin-top: 5rem;">
        <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;width: 100%;flex-wrap: wrap;margin:0.5rem">
            <div><h1 style="color: var(--text-color); margin: 0;">Settings</h1>
            <h3 style="color: var(--text-color2);  margin: 0; font-weight: 400;">Manage the overall functions for Slate, such as theme and preferences.</h3></div>
        </div>
        <div>
            <a href="./index.html"><button id="openSettings" class="backIcon"></button></a>
        </div>
        <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;width: 100%;flex-wrap: wrap;margin:0.5rem">
            <div><h3 style="color: var(--text-color); margin: 0;">Theme</h3>
            <p style="color: var(--text-color2);  margin: 0;">Personalize the style of Slate.</p></div>
            <form id="colorPicker" class="colorPicker">
            </form>
        </div>
        <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;width: 100%;flex-wrap: wrap;margin:0.5rem">
            <div><h3 style="color: var(--text-color); margin: 0;">Elo</h3>
            <p style="color: var(--text-color2);  margin: 0;">A score to help you get tasks done.</p></div>
            <label class="toggle">
                <input type="checkbox" id="btnToggle" name="btnToggle" />
                <span class="slider"></span>
            </label>
            </form>
        </div>
    </div>
    <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 65%; margin-top: 30px;">
        <p><a href="https://github.com/FencingLefty3/SlateLite">V9.26.26.1</a></p>
        <p><a style="color: var(--accent-color3); cursor: pointer; text-decoration: underline;" id="clearDatabaseButton">Reset Storage</a></p>
    </div>
    
</div>
</div>
</body>
</html>
<script src="js/dexie.min.js"></script>
<script src="database.js"></script>
<script src="index.js"></script>
