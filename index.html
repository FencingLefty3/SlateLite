<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Lite</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="icons/256.png">
    <link rel="manifest" href="./manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slate Lite">

    <link rel="apple-touch-icon" href="icons/180.png">
</head>

<body>
    <div class="main-section" >
    <div class="NAV">
        <div class="row-section"><h1>Slate <span style="color: var(--accent-color3);">Lite</span></h1></div>
        <div class="main-section-inverted">
            
                <search class="row-section">
                    <button class="btnNav" id="mobile-menu" aria-label="Toggle Navigation"><img class="ico" src="icons/funnel.svg" alt="Filter"></button>
                    <form style="display: flex;flex-direction: row;justify-content: space-around;align-items: center;" action="./search/">
                        <input style="width: 70%;" type="search" placeholder="Search tasks...">
                        <button type="submit" class="btn2"><img class="ico" src="icons/search.svg" alt="Search"></button>
                    </form>
                </search>
            
            
            <nav class="filters" style="justify-content: center;display: flex;">
                
                
                <div class ="filterButtons">
                    <button style="display: flex;flex-direction: row;gap: 10px; width: 10dvw;" data-tag="0"><img class="svg" src="icons/tags/all.svg" alt="Filter"><p style="margin: 0;">All Tags</p></button>
                    <button style="display: flex;flex-direction: row;gap: 10px; width: 10dvw;" data-tag="0"><img class="svg" src="icons/tags/info.svg" alt="Filter"><p style="margin: 0;">Info</p></button>
                    <button style="display: flex;flex-direction: row;gap: 10px; width: 10dvw;" data-tag="0"><img class="svg" src="icons/tags/star.svg" alt="Filter"><p style="margin: 0;">Star</p></button>
                    <button style="display: flex;flex-direction: row;gap: 10px; width: 10dvw;" data-tag="0"><img class="svg" src="icons/tags/tally-2.svg" alt="Filter"><p style="margin: 0;">Tally 2</p></button>
                    <button style="display: flex;flex-direction: row;gap: 10px; width: 10dvw;" data-tag="0"><img class="svg" src="icons/tags/tally-3.svg" alt="Filter"><p style="margin: 0;">Tally 3</p></button>
                    <button style="display: flex;flex-direction: row;gap: 10px; width: 10dvw;" data-tag="0"><img class="svg" src="icons/tags/tally-4.svg" alt="Filter"><p style="margin: 0;">Tally 4</p></button>
                </div>
            </nav>
            
        </div>
    </div>   <div class="main"> <div class="body">
        <div style="justify-content: space-between; width: 60%;" class="row-section"><h5 style="margin: 0;">List</h5> <button id="createListButton" class="addbtn" style="color: var(--accent-color3); ">Create </button></div>
        <hr style="margin-bottom: 2rem; width: 65%;">

        <div id="listContainer"></div>
        
        <div style="justify-content: space-between; width: 60%;" class="row-section"><h5 style="margin: 0;">Write</h5> <button id="createWriteButton" class="addbtn" style="color: var(--accent-color3);">Create</button></div>
        <hr width="65%"  style="margin-bottom: 2rem;">  

        <div id="writeContainer"></div>
        
                

            
    <!--================================================================-->
        <dialog id="writeCreate">
            <form id="writeCreateFrm" class="writeCreateFrm">
                <input  type="hidden" name="tag" id="writeTagInput" value="0">
                <div style="display: flex;flex-direction: column;align-items: left;gap: 10px;"><input class="formInput" name="title" required type="text" placeholder="Line Name" id="writeTitleInput">
                <textarea class="formInput2" name="content" type="text" placeholder="Content" id="writeTextInput"></textarea>
                <div style="display: flex;flex-direction: row;align-items: center;gap: 10px;justify-content: space-between;"><button style="width: 10%; display: flex; flex-direction: row; gap: 4px;" type="button" name="filter" id="writeFilterInput" class="subbtn" data-tag="0"><img class="ico" src="icons/tags/all.svg" alt="Tag"><p style="margin: 0;">Tags</p></button>
                <button style="width: 90%;" type="submit" class="subbtn"><img class="ico" src="icons/arrow-up.svg" alt="Search"></button></div>
            </form>
        </dialog>
        <dialog id="listCreate">
            <form  id="listCreateFrm" class="listCreateFrm">
                <input type="hidden" name="tag" id="listTagInput" value="0">
                <div style="display: flex;flex-direction: column;align-items: left;gap: 10px;"><input class="formInput" name="title" required type="text" placeholder="Point Name" id="listTitleInput">
                <input class="formInput2" name="date" type="datetime-local" placeholder="Date" id="listDateInput"></div>
                <div style="display: flex;flex-direction: row;align-items: center;gap: 10px;justify-content: space-between;"><button style="width: 10%; display: flex; flex-direction: row; gap: 4px;" type="button" name="filter" id="listFilterInput" class="subbtn" data-tag="0"><img  class="ico" src="icons/tags/all.svg" alt="Tag"><p style="margin: 0;">Tags</p></button>
                <button style="width: 90%;" type="submit" class="subbtn"><img class="ico" src="icons/arrow-up.svg" alt="Search"></button></div>
            </form>
        </dialog>
        <dialog class="tagDialog" id="tagDialog">
            <nav class="filtersDialog">
                    <button data-tooltip="All Tags" data-tag="0"><img class="svg" src="icons/tags/all.svg" alt="Filter"></button>
                    <button data-tooltip="Info Tag" data-tag="1"><img class="svg" src="icons/tags/info.svg" alt="Filter"></button>
                    <button data-tooltip="Star Tag" data-tag="2"><img class="svg" src="icons/tags/star.svg" alt="Filter"></button>
                    <button data-tooltip="Tally 2 Tag" data-tag="3"><img class="svg" src="icons/tags/tally-2.svg" alt="Filter"></button>
                    <button data-tooltip="Tally 3 Tag" data-tag="4"><img class="svg" src="icons/tags/tally-3.svg" alt="Filter"></button>
                    <button data-tooltip="Tally 4 Tag" data-tag="5"><img class="svg" src="icons/tags/tally-4.svg" alt="Filter"></button>
            </nav>
        </dialog>
        <dialog class="settingsDialog" id="settingsDialog">
            <div class="settings">
                <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center;width: 100%;">
                    <div><h3 style="color: var(--text-color); margin: 0;">Theme</h3>
                    <p style="color: var(--text-color2);  margin: 0;">Personalize the style of Slate.</p></div>
                    <form id="colorPicker" class="colorPicker">
                    </form>
                </div>
                <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 65%; margin-top: 30px;">
                    <p><a href="https://github.com/FencingLefty3/SlateLite">V8.23.26.1</a></p>
                    <p><a style="color: var(--accent-color3); cursor: pointer; text-decoration: underline;" id="clearDatabaseButton">Reset Storage</a></p>
                </div>
                
            </div>
        </dialog>
        
    
    </div>
    <footer style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 65%; margin-top: 30px;">
        <p>MLP-2.0</p>
        <div>
            <a href="https://github.com/FencingLefty3/SlateLite/wiki/Slate-Lite-Wiki"><button id="openHelp" class="helpIcon"></button></a>
            <button id="openSettings" class="settingsIcon"></button>
        </div>
    </footer>
    </div>
</body>  
<script src="js/dexie.min.js"></script>
<script src="database.js"></script>
<script src="index.js"></script>
<!-- <script type="module" src="https://cdn.jsdelivr.net/npm/@pwabuilder/pwainstall"></script> -->
</html>
