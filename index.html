<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Lite</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="icons/256.png">
    <link rel="manifest" href="/manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slate Lite">

    <link rel="apple-touch-icon" href="icons/180.png">
</head>
<body>
    <h1>Slate <span style="color: var(--accent-color3);">Lite</span></h1>

    <div class="row-section">
        <nav class="filters">
            <button>All Time</button>
            <button>Today</button>
            <button>This Week</button>
            <button>Later</button>
        </nav>
        <div class="searchBar">
            <input type="text" placeholder="Search tasks...">
        </div>
        <button class="btn2"><img class="ico" src="icons/search.svg" alt="Search"></button>
    </div>
    
    <div style="justify-content: space-between; width: 60%;" class="row-section"><h5 style="margin: 0;">List</h5> <button id="createListButton" class="addbtn" style="color: var(--accent-color3); ">Create </button></div>
    <hr width="65%">

    <div id="listContainer"></div>
    
    <div style="justify-content: space-between; width: 60%;" class="row-section"><h5 style="margin: 0;">Write</h5> <button id="createWriteButton" class="addbtn" style="color: var(--accent-color3);">Create</button></div>
    <hr width="65%">  

    <div id="writeContainer"></div>
</body>
<footer style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 65%; margin-top: 20px;">
    <p>Open source on <a href="https://github.com/FencingLefty3/SlateLite">GitHub</a>.</p><a style="color: var(--accent-color3); cursor: pointer; text-decoration: underline;" id="clearDatabaseButton">Reset Storage.</a>
</footer>

<script src="js/dexie.min.js"></script>
<script src="database.js"></script>
<script src="index.js"></script>
</html>
