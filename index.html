<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Lite</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="icons/256.png">
    <link rel="manifest" href="./manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slate Lite">

    <link rel="apple-touch-icon" href="icons/180.png">
</head>
<body>
    <h1>Slate <span style="color: var(--accent-color3);">Lite</span></h1>
    <div class="row-section">
        <nav class="filters">
            
             <button class="btnNav" id="mobile-menu" aria-label="Toggle Navigation"><img class="ico" src="icons/funnel.svg" alt="Filter"></button>
            <div class ="filterButtons">
                <button data-tag="0"><img class="svg" src="icons/tags/all.svg" alt="Filter"></button>
                <button data-tag="1"><img class="svg" src="icons/tags/info.svg" alt="Filter"></button>
                <button data-tag="2"><img class="svg" src="icons/tags/star.svg" alt="Filter"></button>
                <button data-tag="3"><img class="svg" src="icons/tags/tally-2.svg" alt="Filter"></button>
                <button data-tag="4"><img class="svg" src="icons/tags/tally-3.svg" alt="Filter"></button>
                <button data-tag="5"><img class="svg" src="icons/tags/tally-4.svg" alt="Filter"></button>
            </div>
        </nav>
        <div class="searchBar">
            
            <search>
                <form action="./search/">
                    <input type="search" placeholder="Search tasks...">
                    <button type="submit" class="btn2"><img class="ico" src="icons/search.svg" alt="Search"></button>
                </form>
            </search>
        </div>
        
    </div>
    
    <div style="justify-content: space-between; width: 60%;" class="row-section"><h5 style="margin: 0;">List</h5> <button id="createListButton" class="addbtn" style="color: var(--accent-color3); ">Create </button></div>
    <hr width="65%">

    <div id="listContainer"></div>
    
    <div style="justify-content: space-between; width: 60%;" class="row-section"><h5 style="margin: 0;">Write</h5> <button id="createWriteButton" class="addbtn" style="color: var(--accent-color3);">Create</button></div>
    <hr width="65%">  

    <div id="writeContainer"></div>
    
            

        
    </div>
<!--================================================================-->
    <dialog id="writeCreate">
        <form id="writeCreateFrm" class="writeCreateFrm">
            <input type="hidden" name="tag" id="writeTagInput" value="0">
            <div style="display: flex;flex-direction: column;align-items: left;gap: 10px;"><input class="formInput" name="title" required type="text" placeholder="Line Name" id="writeTitleInput">
            <input class="formInput2" name="content" type="text" placeholder="Content" id="writeTextInput"></div>
            <div style="display: flex;flex-direction: row;align-items: center;gap: 10px;justify-content: space-between;"><button style="width: 10%;" type="button" name="filter" id="writeFilterInput" class="subbtn" data-tag="0"><img class="ico" src="icons/tags/all.svg" alt="Tag"></button>
            <button style="width: 90%;" type="submit" class="subbtn"><img class="ico" src="icons/arrow-up.svg" alt="Search"></button></div>
        </form>
    </dialog>
    <dialog id="listCreate">
        <form  id="listCreateFrm" class="listCreateFrm">
            <input type="hidden" name="tag" id="listTagInput" value="0">
            <div style="display: flex;flex-direction: column;align-items: left;gap: 10px;"><input class="formInput" name="title" required type="text" placeholder="Point Name" id="listTitleInput">
            <input class="formInput2" name="date" type="datetime-local" placeholder="Date" id="listDateInput"></div>
            <div style="display: flex;flex-direction: row;align-items: center;gap: 10px;justify-content: space-between;"><button style="width: 10%;" type="button" name="filter" id="listFilterInput" class="subbtn" data-tag="0"><img class="ico" src="icons/tags/all.svg" alt="Tag"></button>
            <button style="width: 90%;" type="submit" class="subbtn"><img class="ico" src="icons/arrow-up.svg" alt="Search"></button></div>
        </form>
    </dialog>
    <dialog class="tagDialog" id="tagDialog">
        <nav class="filtersDialog">
                <button data-tag="0"><img class="svg" src="icons/tags/all.svg" alt="Filter"></button>
                <button data-tag="1"><img class="svg" src="icons/tags/info.svg" alt="Filter"></button>
                <button data-tag="2"><img class="svg" src="icons/tags/star.svg" alt="Filter"></button>
                <button data-tag="3"><img class="svg" src="icons/tags/tally-2.svg" alt="Filter"></button>
                <button data-tag="4"><img class="svg" src="icons/tags/tally-3.svg" alt="Filter"></button>
                <button data-tag="5"><img class="svg" src="icons/tags/tally-4.svg" alt="Filter"></button>
        </nav>
    </dialog>

</body>
<footer style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 65%; margin-top: 20px;">
    <p><a href="https://github.com/FencingLefty3/SlateLite">V8.7.26.3</a></p><a style="color: var(--accent-color3); cursor: pointer; text-decoration: underline;" id="clearDatabaseButton">Reset Storage</a>
</footer>

<script src="js/dexie.min.js"></script>
<script src="database.js"></script>
<script src="index.js"></script>
<!-- <script type="module" src="https://cdn.jsdelivr.net/npm/@pwabuilder/pwainstall"></script> -->
</html>
